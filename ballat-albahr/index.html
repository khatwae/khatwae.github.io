<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />

    <title>بلّط البحر — اللعبة</title>
    <script data-goatcounter="https://ballat-albahr.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #0c2b33;
        --ink-soft: #3d5a63;
        --line: rgba(160, 200, 210, 0.55);
        --hud-bg: rgba(255, 255, 255, 0.88);
        --yt: #ff0033;
        --gold: #d97706;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #eaf6f8;
          --ink-soft: #a8c8cf;
          --line: rgba(90, 140, 155, 0.5);
          --hud-bg: rgba(8, 32, 42, 0.88);
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        font-family: "Rubik", system-ui, sans-serif;
        background: #0b5e74;
        color: var(--ink);
        -webkit-user-select: none;
        user-select: none;
      }

      /* ---------- مسرح اللعبة: ملء الشاشة من أول لحظة ---------- */
      .stage {
        position: fixed;
        inset: 0;
        height: 100dvh;
        overflow: hidden;
        background: linear-gradient(180deg, #79c7e3 0%, #3d9dbd 55%, #12809e 100%);
        outline: none;
        -webkit-touch-callout: none;
      }
      .stage:focus-visible { outline: 3px solid #fff; outline-offset: -3px; }
      #gl { position: absolute; inset: 0; z-index: 1; }
      #gl canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      .gl-fallback {
        position: absolute; inset: 0; z-index: 1;
        display: none;
        align-items: center; justify-content: center;
        text-align: center; padding: 24px;
        background: linear-gradient(180deg, #79c7e3, #12809e);
        color: #fff; font-weight: 800; font-size: 1.05rem;
      }

      /* ---------- شاشة التحميل (إحساس لعبة) ---------- */
      .loader {
        position: absolute; inset: 0; z-index: 60;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        background: linear-gradient(180deg, #8fd0ea 0%, #4aa8c6 45%, #0e6e8c 100%);
        transition: opacity 0.7s ease;
        text-align: center; padding: 24px;
      }
      .loader.done { opacity: 0; pointer-events: none; }
      .loader .l-title {
        font-size: clamp(2.4rem, 9vw, 3.6rem);
        font-weight: 900; color: #fff; line-height: 1.15;
        text-shadow: 0 3px 0 rgba(8, 70, 90, 0.35), 0 10px 26px rgba(8, 70, 90, 0.35);
      }
      .loader .l-sub { color: rgba(255,255,255,0.92); font-weight: 700; font-size: 1rem; }
      .loader .l-bar {
        width: min(260px, 70vw); height: 12px;
        border-radius: 999px;
        background: rgba(255,255,255,0.3);
        border: 2px solid rgba(255,255,255,0.65);
        overflow: hidden;
      }
      .loader .l-bar > i {
        display: block; height: 100%; width: 0%;
        background: #ffb340;
        border-radius: 999px;
        transition: width 0.35s ease;
      }
      .loader .l-waves { font-size: 1.5rem; letter-spacing: 6px; opacity: 0.85; animation: bob 1.6s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

      /* ---------- HUD العلوي: عدّاد صغير بس ---------- */
      .hud-top {
        position: absolute;
        top: calc(env(safe-area-inset-top, 0px) + 10px);
        inset-inline-start: 10px;
        inset-inline-end: 10px;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
        pointer-events: none;
      }
      .chip {
        pointer-events: auto;
        display: inline-flex; align-items: center; gap: 8px;
        background: var(--hud-bg);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 14px 6px 10px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        font-family: inherit;
        color: var(--ink);
        box-shadow: 0 6px 18px rgba(6, 45, 60, 0.25);
      }
      button.chip { cursor: pointer; }
      button.chip:active { transform: scale(0.96); }
      .chip .play {
        width: 26px; height: 26px; border-radius: 50%;
        background: var(--yt); color: #fff;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 0.72rem; flex: none;
        box-shadow: 0 3px 8px rgba(200, 0, 40, 0.4);
      }
      .chip .c-num { font-weight: 900; font-size: 1.02rem; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .chip .c-lab { font-size: 0.68rem; font-weight: 700; color: var(--ink-soft); line-height: 1.1; white-space: nowrap; }
      .chip .c-txt { display: flex; flex-direction: column; }
      .chip .mini-bar { width: 74px; height: 5px; border-radius: 999px; background: rgba(120,160,170,0.35); overflow: hidden; margin-top: 3px; }
      .chip .mini-bar > i { display: block; height: 100%; width: 0%; background: var(--yt); transition: width 1.2s ease; }
      .chip.chest { border-color: rgba(217, 119, 6, 0.55); font-weight: 800; font-size: 0.86rem; padding: 8px 14px; }
      .chip.chest .lock { font-size: 1rem; }

      /* ---------- أزرار اللعب السفلية ---------- */
      .sub-btn {
        position: absolute;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
        inset-inline-start: 14px;
        z-index: 10;
        display: inline-flex; align-items: center; gap: 9px;
        background: var(--yt); color: #fff;
        font-weight: 900; font-size: 1rem;
        padding: 13px 22px; border-radius: 999px;
        text-decoration: none;
        box-shadow: 0 10px 24px rgba(160, 0, 30, 0.45);
        border: 2px solid rgba(255,255,255,0.5);
      }
      .sub-btn:active { transform: scale(0.96); }
      @keyframes subPulse {
        0% { box-shadow: 0 10px 24px rgba(160, 0, 30, 0.45), 0 0 0 0 rgba(255, 0, 51, 0.55); }
        70% { box-shadow: 0 10px 24px rgba(160, 0, 30, 0.45), 0 0 0 16px rgba(255, 0, 51, 0); }
        100% { box-shadow: 0 10px 24px rgba(160, 0, 30, 0.45), 0 0 0 0 rgba(255, 0, 51, 0); }
      }
      .sub-btn { animation: subPulse 2.2s ease-out infinite; font-size: 1.08rem; padding: 15px 26px; z-index: 12; }
      @media (prefers-reduced-motion: reduce) { .sub-btn { animation: none; } }
      .stage.expanded-fixed { position: fixed; inset: 0; height: 100dvh; z-index: 999; }
      body.locked { overflow: hidden; }
      .sub-btn .play {
        width: 24px; height: 24px; border-radius: 50%;
        background: #fff; color: var(--yt);
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 0.66rem;
      }
      .cambtns {
        position: absolute;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
        inset-inline-end: 14px;
        z-index: 10;
        display: flex; flex-direction: column; gap: 8px;
      }
      .cambtns button {
        width: 48px; height: 48px; border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--hud-bg);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: var(--ink);
        font-family: inherit;
        font-size: 1.4rem; font-weight: 800; line-height: 1;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 6px 16px rgba(6, 45, 60, 0.28);
      }
      .cambtns button:active { transform: scale(0.92); }
      .cambtns button.small { font-size: 1.02rem; }
      .cambtns button.sound { font-size: 1.15rem; position: relative; }
      .cambtns button.sound.muted { opacity: 0.62; }
      .cambtns button.sound.muted::after {
        content: ""; position: absolute; left: 9px; right: 9px; top: 50%;
        height: 3px; border-radius: 2px; background: #e23b3b;
        transform: rotate(-38deg);
      }

      .hint {
        position: absolute;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
        left: 50%; transform: translateX(-50%);
        z-index: 9;
        background: rgba(6, 40, 52, 0.55);
        color: #eaf6f8;
        border-radius: 999px;
        padding: 7px 18px;
        font-size: 0.85rem; font-weight: 700;
        white-space: nowrap;
        pointer-events: none;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        transition: opacity 1s ease;
      }
      .hint.faded { opacity: 0; }
      @media (max-width: 760px) { .hint { display: none; } }

      .toast {
        position: absolute;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 78px);
        left: 50%; transform: translate(-50%, 12px);
        z-index: 11;
        max-width: min(92vw, 520px);
        background: var(--hud-bg);
        border: 1px solid var(--line);
        color: var(--ink);
        border-radius: 16px;
        padding: 10px 18px;
        font-weight: 700; font-size: 0.95rem;
        text-align: center;
        box-shadow: 0 10px 26px rgba(6, 45, 60, 0.3);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        opacity: 0; pointer-events: none;
        transition: opacity 0.35s ease, transform 0.35s ease;
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      /* ---------- عصا التجوّل ---------- */
      .stick {
        position: absolute;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
        inset-inline-start: 18px;
        z-index: 10;
        width: 118px; height: 118px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.22);
        border: 2px solid rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        display: none;
        touch-action: none;
      }
      .stage.explore .stick { display: block; }
      .stick .knob {
        position: absolute; left: 50%; top: 50%;
        width: 52px; height: 52px; border-radius: 50%;
        background: var(--hud-bg);
        border: 1px solid var(--line);
        box-shadow: 0 4px 12px rgba(6, 45, 60, 0.35);
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      .stick .knob::after {
        content: ""; position: absolute; inset: 15px;
        border-radius: 50%; background: #12809e; opacity: 0.55;
      }
      /* زر الاشتراك بيضل ظاهر دائماً — حتى بوضع التجوّل */
    </style>
  </head>
  <body>
    <div class="stage" id="stage" tabindex="0" aria-label="لعبة بلط البحر: جزيرة وسط بحر حقيقي، اسحب للتدوير حول الجزيرة وقرّب وبعّد للاستكشاف">
      <div id="gl" aria-hidden="true"></div>
      <div class="gl-fallback" id="glFallback">متصفحك ما بيدعم العرض ثلاثي الأبعاد هون — جرّب متصفح أحدث لتلعب.</div>

      <div class="loader" id="loader" aria-hidden="true">
        <div class="l-waves">〰️ 🌊 〰️</div>
        <div class="l-title">بلّط البحر</div>
        <div class="l-bar"><i id="loadFill"></i></div>
        <div class="l-sub">عم نجهّز البحر والجزيرة…</div>
      </div>

      <div class="hud-top">
        <button type="button" class="chip" id="counterChip" aria-label="عداد يوتيوب: اضغط لعرض البحر كله">
          <span class="play">▶</span>
          <span class="c-txt">
            <span class="c-num"><span id="countNow">4</span> / 10,000</span>
            <span class="c-lab">بلاطة بالبحر · يوتيوب</span>
            <span class="mini-bar"><i id="miniFill"></i></span>
          </span>
        </button>
        <div class="chip chest" aria-label="صندوق الكنز مقفول">
          <span class="lock">🔒</span><span>شو فيه الصندوق؟</span>
        </div>
      </div>

      <a class="sub-btn" id="subBtn" href="https://www.youtube.com/@ballat.albahr?sub_confirmation=1" target="_blank" rel="noopener" aria-label="اشترك بقناة بلط البحر على يوتيوب">
        <span class="play">▶</span><span>اشترك بالقناة</span>
      </a>

      <div class="cambtns">
        <button type="button" id="soundToggle" class="sound" aria-label="تشغيل أو كتم أصوات البحر والنوارس" aria-pressed="true" title="الصوت">🔊</button>
        <button type="button" id="fsToggle" class="small" aria-label="ملء الشاشة والتجوّل بالجزيرة">⛶</button>
        <button type="button" id="zoomIn" aria-label="تقريب الكاميرا">+</button>
        <button type="button" id="zoomOut" aria-label="إبعاد الكاميرا">−</button>
        <button type="button" id="camReset" class="small" aria-label="إعادة ضبط الكاميرا">⌖</button>
      </div>

      <div class="stick" id="stick" aria-hidden="true"><div class="knob" id="stickKnob"></div></div>
      <div class="hint" id="hint">اسحب لتدوّر حول الجزيرة · قرّب وبعّد بإصبعين · جرّب تفتح صندوق الكنز</div>
      <div class="toast" id="toast" role="status"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      // ======= بيانات التحدي =======
      var TOTAL = 10000;
      var COUNT = 4; // مشتركون جدد على يوتيوب من يوم الإطلاق = بلاطات بالبحر — 4 مشتركين = 4 بلاطات مرسومة، والجاية رقم 5
      var fmt = new Intl.NumberFormat("ar-JO-u-nu-latn");
      document.getElementById("countNow").textContent = fmt.format(COUNT);
      requestAnimationFrame(function () {
        document.getElementById("miniFill").style.width = (COUNT / TOTAL) * 100 + "%";
      });

      var stage = document.getElementById("stage");
      var glHost = document.getElementById("gl");
      var loader = document.getElementById("loader");
      var loadFill = document.getElementById("loadFill");
      var toast = document.getElementById("toast");
      var toastTimer = null;
      function showToast(msg, ms) {
        toast.textContent = msg;
        toast.classList.add("show");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove("show"); }, ms || 4200);
      }
      function loadProgress(p) { loadFill.style.width = Math.round(p * 100) + "%"; }
      loadProgress(0.15);

      // ======= الصوت المحيطي: بحر هادي + نوارس بعيدة — كله مولّد برمجياً وخفيف =======
      var SoundFX = (function () {
        var ctx = null, master = null, started = false, muted = false;
        var gullTimer = null;
        function ensure() {
          if (ctx) { if (ctx.state === "suspended" && !muted) ctx.resume(); return ctx; }
          try {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return null;
            ctx = new AC();
            master = ctx.createGain();
            master.gain.value = muted ? 0 : 1;
            master.connect(ctx.destination);
            startSea();
            scheduleGull();
            started = true;
            if (ctx.state === "suspended" && !muted) ctx.resume();
          } catch (e) { ctx = null; }
          return ctx;
        }
        function noiseBuffer(seconds) {
          var len = Math.floor(ctx.sampleRate * seconds);
          var buf = ctx.createBuffer(1, len, ctx.sampleRate);
          var d = buf.getChannelData(0);
          var last = 0;
          for (var i = 0; i < len; i++) {
            var white = Math.random() * 2 - 1;
            last = (last + 0.02 * white) / 1.02; // ضجيج بنّي ناعم
            d[i] = last * 3.2;
          }
          return buf;
        }
        function startSea() {
          // موجات: ضجيج ناعم بيتنفّس ببطء — صوت بحر خفيف جداً
          var src = ctx.createBufferSource();
          src.buffer = noiseBuffer(4); src.loop = true;
          var filt = ctx.createBiquadFilter();
          filt.type = "lowpass"; filt.frequency.value = 420; filt.Q.value = 0.4;
          var waveGain = ctx.createGain(); waveGain.gain.value = 0.045;
          src.connect(filt); filt.connect(waveGain); waveGain.connect(master);
          src.start();
          var lfo = ctx.createOscillator(); lfo.type = "sine"; lfo.frequency.value = 0.09;
          var lfoG = ctx.createGain(); lfoG.gain.value = 0.022;
          lfo.connect(lfoG); lfoG.connect(waveGain.gain); lfo.start();
          var lfo2 = ctx.createOscillator(); lfo2.type = "sine"; lfo2.frequency.value = 0.06;
          var lfo2G = ctx.createGain(); lfo2G.gain.value = 150;
          lfo2.connect(lfo2G); lfo2G.connect(filt.frequency); lfo2.start();
          // رغوة خفيفة على الشط
          var src2 = ctx.createBufferSource();
          var nb = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
          var dd = nb.getChannelData(0);
          for (var j = 0; j < dd.length; j++) dd[j] = Math.random() * 2 - 1;
          src2.buffer = nb; src2.loop = true;
          var bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 2400; bp.Q.value = 0.5;
          var g2 = ctx.createGain(); g2.gain.value = 0.006;
          src2.connect(bp); bp.connect(g2); g2.connect(master); src2.start();
          var lfo3 = ctx.createOscillator(); lfo3.type = "sine"; lfo3.frequency.value = 0.13;
          var lfo3G = ctx.createGain(); lfo3G.gain.value = 0.004;
          lfo3.connect(lfo3G); lfo3G.connect(g2.gain); lfo3.start();
        }
        function gullCry(when, baseFreq, vol) {
          var o = ctx.createOscillator(); o.type = "sine";
          var g = ctx.createGain(); g.gain.value = 0;
          var vib = ctx.createOscillator(); vib.frequency.value = 28;
          var vibG = ctx.createGain(); vibG.gain.value = 22;
          vib.connect(vibG); vibG.connect(o.frequency);
          o.frequency.setValueAtTime(baseFreq, when);
          o.frequency.exponentialRampToValueAtTime(baseFreq * 0.62, when + 0.42);
          o.frequency.exponentialRampToValueAtTime(baseFreq * 0.8, when + 0.6);
          g.gain.setValueAtTime(0, when);
          g.gain.linearRampToValueAtTime(vol, when + 0.07);
          g.gain.exponentialRampToValueAtTime(0.0001, when + 0.62);
          o.connect(g); g.connect(master);
          o.start(when); vib.start(when); o.stop(when + 0.7); vib.stop(when + 0.7);
        }
        function scheduleGull() {
          if (gullTimer) clearTimeout(gullTimer);
          gullTimer = setTimeout(function () {
            if (ctx && !muted && ctx.state === "running") {
              var t0 = ctx.currentTime + 0.05;
              var cries = 1 + Math.floor(Math.random() * 3);
              for (var i = 0; i < cries; i++) {
                gullCry(t0 + i * (0.55 + Math.random() * 0.25), 1250 + Math.random() * 350, 0.016 + Math.random() * 0.012);
              }
            }
            scheduleGull();
          }, 7000 + Math.random() * 11000);
        }
        function clank(delay, vol, freq) {
          if (!ctx || muted) return;
          var when = ctx.currentTime + (delay || 0);
          // صوت معدني: نغمات عالية قصيرة + طقة ضجيج
          [1, 1.51, 2.28].forEach(function (m, idx) {
            var o = ctx.createOscillator(); o.type = "triangle";
            o.frequency.value = (freq || 2100) * m;
            var g = ctx.createGain();
            g.gain.setValueAtTime(vol * (idx === 0 ? 1 : 0.45), when);
            g.gain.exponentialRampToValueAtTime(0.0001, when + 0.14);
            o.connect(g); g.connect(master); o.start(when); o.stop(when + 0.16);
          });
          var nb = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.05), ctx.sampleRate);
          var dd = nb.getChannelData(0);
          for (var i = 0; i < dd.length; i++) dd[i] = (Math.random() * 2 - 1) * (1 - i / dd.length);
          var ns = ctx.createBufferSource(); ns.buffer = nb;
          var bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 3200; bp.Q.value = 1.1;
          var ng = ctx.createGain(); ng.gain.value = vol * 0.8;
          ns.connect(bp); bp.connect(ng); ng.connect(master); ns.start(when);
        }
        function rattle() {
          if (!ensure() || muted) return;
          for (var i = 0; i < 6; i++) clank(i * 0.09 + Math.random() * 0.02, 0.05 + Math.random() * 0.03, 1900 + Math.random() * 500);
        }
        function slam() {
          if (!ctx || muted) return;
          clank(0, 0.14, 1500); clank(0.03, 0.08, 900);
        }
        function setMuted(m) {
          muted = m;
          if (m) {
            if (ctx) ctx.suspend();
            var a = document.getElementById("salliAudio");
            if (a) { a.pause(); }
          } else {
            ensure();
            if (ctx && ctx.state === "suspended") ctx.resume();
          }
        }
        return {
          ensure: ensure,
          rattle: rattle,
          slam: slam,
          setMuted: setMuted,
          isMuted: function () { return muted; },
          isStarted: function () { return started; }
        };
      })();

      // الصوت بيبدأ مع أول لمسة (المتصفحات بتمنع التشغيل التلقائي)
      function kickAudio() { SoundFX.ensure(); }
      window.addEventListener("pointerdown", kickAudio, { passive: true });
      window.addEventListener("keydown", kickAudio);
      var soundBtn = document.getElementById("soundToggle");
      if (soundBtn) soundBtn.addEventListener("click", function () {
        var nowMuted = !SoundFX.isMuted();
        SoundFX.setMuted(nowMuted);
        soundBtn.textContent = nowMuted ? "🔇" : "🔊";
        soundBtn.classList.toggle("muted", nowMuted);

            "uniform float uTime;",

            "#include <fog_pars_vertex>",
            "float wheight(vec2 p) {",
            "  float h = 0.0;",

            "void main() {",
            "  vec4 wp = modelMatrix * vec4(position, 1.0);",

        // الترتيب: حلقات ملاصقة لخطّ الشطّ حوالين الجزيرة من الأقرب للأبعد، وبداخل كل حلقة البداية من
        // الجهة المقابلة لزاوية الكاميرا الافتراضية (0.65) — أول بلاطات بينحطّوا قدّام العين بدون تدوير
        var CAM_ANG = 0.65;

        // (مادة بيضاء أساساً عشان لون النسخة ما ينضرب بلون المادة وتصير البلاطة غامقة)

            var bird = new THREE.Group();
            var bbody = new THREE.Mesh(new THREE.SphereGeometry(0.55, 10, 8), gullMat);
            bbody.scale.set(1, 0.75, 2.1);
            bird.add(bbody);
            var beak = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.55, 6), new THREE.MeshStandardMaterial({ color: 0xf2a81d, roughness: 0.7 }));
            beak.rotation.x = Math.PI / 2;
            beak.position.set(0, 0, 1.35);
            bird.add(beak);
            var wingGeo = new THREE.PlaneGeometry(2.6, 0.85);
            wingGeo.translate(1.3, 0, 0);
            var wl = new THREE.Mesh(wingGeo, tipMat);
            wl.rotation.x = -Math.PI / 2;
            bird.add(wl);
            var wingGeoR = new THREE.PlaneGeometry(2.6, 0.85);
            wingGeoR.translate(-1.3, 0, 0);
            var wr = new THREE.Mesh(wingGeoR, tipMat);
            wr.rotation.x = -Math.PI / 2;
            bird.add(wr);
            bird.userData = {
              wl: wl, wr: wr,
              radius: 38 + hash(gi * 7) * 34,
              height: 24 + hash(gi * 13) * 14,
              speed: (0.05 + hash(gi * 3) * 0.035) * (gi % 2 ? 1 : -1),
              phase: hash(gi * 17) * 6.28,
              flap: 6 + hash(gi * 5) * 3
            };
            bird.position.set(Math.cos(bird.userData.phase) * bird.userData.radius, bird.userData.height, Math.sin(bird.userData.phase) * bird.userData.radius);
            scene.add(bird);
            gulls.push(bird);
          }
        })();

        // ----- الكاميرا: تدوير + تقريب + تجوّل -----
        var VW = 0, VH = 0;
        var cam = { theta: 0.65, phi: 1.0, radius: 105, tx: 0, tz: 0 };
        camGoal = { theta: 0.65, phi: 1.0, radius: 105, tx: 0, tz: 0 };
        var R_MIN = 34, R_MAX = 280;
        function fit() {
          VW = stage.clientWidth; VH = stage.clientHeight;
          renderer.setSize(VW, VH);
          camera.aspect = VW / VH;
          camera.updateProjectionMatrix();
        }
        window.addEventListener("resize", fit);
        fit();

        resetCamFn = function () {
          camGoal.theta = 0.65; camGoal.phi = 1.0; camGoal.radius = 105; camGoal.tx = 0; camGoal.tz = 0;
        };
        flyToFn = function (tx, tz, radius, phi) {
          camGoal.tx = tx; camGoal.tz = tz;
          camGoal.radius = radius; camGoal.phi = phi;
        };

        var pointers = new Map();
        var pinch = null, downInfo = null, lastInteract = performance.now();
        var dom = renderer.domElement;
        function ptrDist() {
          var pts = Array.from(pointers.values());
          return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        }
        dom.addEventListener("pointerdown", function (e) {
          try { stage.focus({ preventScroll: true }); } catch (err) { stage.focus(); }
          pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
          try { dom.setPointerCapture(e.pointerId); } catch (err) {}
          lastInteract = performance.now();
          if (pointers.size === 1) { downInfo = { id: e.pointerId, x: e.clientX, y: e.clientY, t: Date.now(), moved: 0 }; pinch = null; }
          else if (pointers.size === 2) { pinch = { d: ptrDist(), r: camGoal.radius }; downInfo = null; }
        });
        dom.addEventListener("pointermove", function (e) {
          if (!pointers.has(e.pointerId)) return;
          var prev = pointers.get(e.pointerId);
          var dxp = e.clientX - prev.x, dyp = e.clientY - prev.y;
          pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
          lastInteract = performance.now();
          if (pinch && pointers.size === 2) {
            var nd = ptrDist();
            if (pinch.d > 0) camGoal.radius = Math.max(R_MIN, Math.min(R_MAX, pinch.r * pinch.d / nd));
          } else if (pointers.size === 1) {
            if (downInfo) downInfo.moved += Math.abs(dxp) + Math.abs(dyp);
            camGoal.theta -= dxp * 0.0052;
            camGoal.phi = Math.max(0.16, Math.min(1.38, camGoal.phi - dyp * 0.0042));
          }
        });
        function ptrEnd(e) {
          if (downInfo && e.pointerId === downInfo.id) {
            if (Date.now() - downInfo.t < 350 && downInfo.moved < 10) pickAt(e.clientX, e.clientY);
            downInfo = null;
          }
          pointers.delete(e.pointerId);
          if (pointers.size < 2) pinch = null;
          lastInteract = performance.now();
        }
        dom.addEventListener("pointerup", ptrEnd);
        dom.addEventListener("pointercancel", ptrEnd);
        dom.addEventListener("wheel", function (e) {
          e.preventDefault();
          camGoal.radius = Math.max(R_MIN, Math.min(R_MAX, camGoal.radius * Math.exp(e.deltaY * 0.0014)));
          lastInteract = performance.now();
        }, { passive: false });
        dom.addEventListener("contextmenu", function (e) { e.preventDefault(); });

        document.getElementById("zoomIn").addEventListener("click", function () {
          camGoal.radius = Math.max(R_MIN, camGoal.radius / 1.35); lastInteract = performance.now();
        });
        document.getElementById("zoomOut").addEventListener("click", function () {
          camGoal.radius = Math.min(R_MAX, camGoal.radius * 1.35); lastInteract = performance.now();
        });
        document.getElementById("camReset").addEventListener("click", function () {
          resetCamFn(); lastInteract = performance.now();
        });
        document.getElementById("counterChip").addEventListener("click", function () {
          flyToFn(0, 0, 190, 1.05);
          showToast(COUNT === 0
            ? "البحر لسّا فاضي — 0 من " + fmt.format(TOTAL) + " بلاطة. أول مشترك جديد بيحطّ البلاطة رقم 1 عند الجزيرة"
            : fmt.format(COUNT) + " بلاطة تبلّطت من " + fmt.format(TOTAL) + " · ضايل " + fmt.format(TOTAL - COUNT));
          lastInteract = performance.now();
        });

        // ----- وضع ملء الشاشة والتجوّل -----
        var explore = false;
        var fsToggle = document.getElementById("fsToggle");
        var stick = document.getElementById("stick");
        var knob = document.getElementById("stickKnob");
        var joy = { x: 0, y: 0 };
        var keysDown = {};
        var MAP_LIM = 120;
        function setExplore(on) {
          explore = on;
          stage.classList.toggle("explore", on);
          R_MIN = on ? 14 : 34;
          if (camGoal.radius < R_MIN) camGoal.radius = R_MIN;
          fsToggle.textContent = on ? "✕" : "⛶";
          fsToggle.setAttribute("aria-label", on ? "تصغير الشاشة والرجوع للوضع العادي" : "ملء الشاشة والتجوّل بالجزيرة");
          if (!on) {
            joy.x = 0; joy.y = 0;
            knob.style.transform = "translate(-50%,-50%)";
            keysDown = {};
            resetCamFn();
          }
          lastInteract = performance.now();
          requestAnimationFrame(fit);
          setTimeout(fit, 120);
        }
        function fixedExpand() {
          if (explore) return;
          stage.classList.add("expanded-fixed");
          document.body.classList.add("locked");
          setExplore(true);
        }
        function enterExpand() {
          var p = null;
          try {
            if (stage.requestFullscreen) p = stage.requestFullscreen();
            else if (stage.webkitRequestFullscreen) stage.webkitRequestFullscreen();
          } catch (err) {}
          if (p && p.catch) p.catch(function () { fixedExpand(); });
          else if (!stage.requestFullscreen && !stage.webkitRequestFullscreen) fixedExpand();
          setTimeout(function () {
            if (!explore && document.fullscreenElement !== stage) fixedExpand();
          }, 400);
        }
        function exitExpand() {
          if (document.fullscreenElement) { try { document.exitFullscreen(); } catch (err) {} }
          if (document.webkitFullscreenElement) { try { document.webkitExitFullscreen(); } catch (err) {} }
          stage.classList.remove("expanded-fixed");
          document.body.classList.remove("locked");
          if (explore) setExplore(false);
        }
        fsToggle.addEventListener("click", function () {
          if (explore || document.fullscreenElement === stage || stage.classList.contains("expanded-fixed")) exitExpand();
          else enterExpand();
        });
        document.addEventListener("fullscreenchange", function () {
          if (document.fullscreenElement === stage) setExplore(true);
          else if (explore && !stage.classList.contains("expanded-fixed")) setExplore(false);
          fit();
        });
        document.addEventListener("webkitfullscreenchange", function () {
          if (document.webkitFullscreenElement === stage) setExplore(true);
          fit();
        });
        stage.addEventListener("keydown", function (e) {
          if (!explore) return;
          var k = (e.key || "").toLowerCase();
          if (["arrowup", "arrowdown", "arrowleft", "arrowright", "w", "a", "s", "d"].indexOf(k) >= 0) {
            keysDown[k] = true;
            e.preventDefault();
            lastInteract = performance.now();
          }
        });
        stage.addEventListener("keyup", function (e) { delete keysDown[(e.key || "").toLowerCase()]; });
        window.addEventListener("blur", function () { keysDown = {}; });
        var stickPtr = null;
        function stickMove(e) {
          var r = stick.getBoundingClientRect();
          var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
          var dx = e.clientX - cx, dy = e.clientY - cy;
          var max = r.width / 2 - 10;
          var len = Math.hypot(dx, dy);
          if (len > max) { dx *= max / len; dy *= max / len; }
          joy.x = dx / max; joy.y = dy / max;
          knob.style.transform = "translate(calc(-50% + " + dx + "px), calc(-50% + " + dy + "px))";
          lastInteract = performance.now();
        }
        stick.addEventListener("pointerdown", function (e) {
          stickPtr = e.pointerId;
          try { stick.setPointerCapture(e.pointerId); } catch (err) {}
          stickMove(e);
          e.preventDefault();
        });
        stick.addEventListener("pointermove", function (e) { if (e.pointerId === stickPtr) stickMove(e); });
        function stickEnd(e) {
          if (e.pointerId !== stickPtr) return;
          stickPtr = null; joy.x = 0; joy.y = 0;
          knob.style.transform = "translate(-50%,-50%)";
        }
        stick.addEventListener("pointerup", stickEnd);
        stick.addEventListener("pointercancel", stickEnd);

        // ----- الضغط على عناصر المشهد -----
        var raycaster = new THREE.Raycaster();
        function pickAt(cx, cy) {
          var rect = dom.getBoundingClientRect();
          var nd = new THREE.Vector2(
            ((cx - rect.left) / rect.width) * 2 - 1,
            -((cy - rect.top) / rect.height) * 2 + 1
          );
          raycaster.setFromCamera(nd, camera);
          var hitChest = raycaster.intersectObject(treasureChest, true);
          if (hitChest.length) {
            flyToFn(-8.5, 2.5, 46, 1.05);
            if (!chestAttempt) {
              // محاولة فتح: بيهزّ وبيخبط القفل، الغطا بيحاول يرتفع وبيسكر — وبيضل مقفول
              chestAttempt = { start: clock.elapsedTime, rattled: false, slammed: false, spoke: false };
              showToast("عم تحاول تفتحه؟ القفل ماسك منيح 🔒 — بيفتح بس عند " + fmt.format(TOTAL) + " بلاطة… شو فيه الصندوق؟ 🤔", 4600);
            }
            return;
          }
          var hitHero = raycaster.intersectObject(hero, true);
          if (hitHero.length) {
            showToast("أهلاً فيك بجزيرة بلّط البحر! كل مشترك جديد على يوتيوب = بلاطة جديدة بالبحر");
            return;
          }
          var hitWater = raycaster.intersectObject(water);
          if (hitWater.length) {
            var hp = hitWater[0].point;
            if (Math.abs(hp.x) <= SEA / 2 && Math.abs(hp.z) <= SEA / 2) {
              showToast(COUNT === 0
                ? "هاد البحر بينتبلّط بلاطة بلاطة — لسّا 0 من " + fmt.format(TOTAL) + ". اشترك وخَلّ بلاطتك تكون الأولى"
                : fmt.format(COUNT) + " بلاطة تبلّطت · ضايل " + fmt.format(TOTAL - COUNT) + " بلاطة لنكمّل البحر");
            } else {
              showToast("برّا شبكة البلاط — البحر المفتوح. البلاط بينحطّ حوالين الجزيرة بس");
            }
          }
        }

        // ----- حلقة الرسم -----
        var clock = new THREE.Clock();
        var frames = 0;
        function animate() {
          requestAnimationFrame(animate);
          var dt = Math.min(0.05, clock.getDelta());
          var t = clock.elapsedTime;

          waterUniforms.uTime.value = t;

          if (!reduced && !explore && performance.now() - lastInteract > 5000 && pointers.size === 0) {
            camGoal.theta += dt * 0.045;
          }
          if (explore) {
            var kx = ((keysDown["arrowright"] || keysDown["d"]) ? 1 : 0) - ((keysDown["arrowleft"] || keysDown["a"]) ? 1 : 0);
            var kz = ((keysDown["arrowdown"] || keysDown["s"]) ? 1 : 0) - ((keysDown["arrowup"] || keysDown["w"]) ? 1 : 0);
            var mx = joy.x + kx, mz = joy.y + kz;
            var ml = Math.hypot(mx, mz);
            if (ml > 0.12) {
              if (ml > 1) { mx /= ml; mz /= ml; }
              var spd = 65 * dt * Math.max(0.35, camGoal.radius / 105);
              var fx = -Math.sin(camGoal.theta), fz = -Math.cos(camGoal.theta);
              var rx = -fz, rz = fx;
              camGoal.tx += (fx * -mz + rx * mx) * spd;
              camGoal.tz += (fz * -mz + rz * mx) * spd;
              camGoal.tx = Math.max(-MAP_LIM, Math.min(MAP_LIM, camGoal.tx));
              camGoal.tz = Math.max(-MAP_LIM, Math.min(MAP_LIM, camGoal.tz));
              lastInteract = performance.now();
            }
          }
          var k = reduced ? 1 : Math.min(1, dt * 4.2);
          cam.theta += (camGoal.theta - cam.theta) * k;
          cam.phi += (camGoal.phi - cam.phi) * k;
          cam.radius += (camGoal.radius - cam.radius) * k;
          cam.tx += (camGoal.tx - cam.tx) * k;
          cam.tz += (camGoal.tz - cam.tz) * k;
          var sp = Math.sin(cam.phi), cp = Math.cos(cam.phi);
          camera.position.set(
            cam.tx + cam.radius * sp * Math.sin(cam.theta),
            Math.max(3.5, cam.radius * cp + 2),
            cam.tz + cam.radius * sp * Math.cos(cam.theta)
          );
          camera.lookAt(cam.tx, 1, cam.tz);

          if (!reduced) {
            buoys.forEach(function (buoy) {
              buoy.position.y = 0.2 + Math.sin(t * 1.6 + buoy.userData.phase) * 0.24;
              buoy.rotation.z = Math.sin(t * 1.3 + buoy.userData.phase) * 0.16;
            });
            foamRings.forEach(function (ring) {
              var s = 1 + Math.sin(t * 0.9 + ring.userData.phase) * 0.03;
              ring.scale.set(s, s, 1);
              ring.material.opacity = 0.34 + Math.sin(t * 0.9 + ring.userData.phase) * 0.16;
            });
            hero.position.y = TOP + Math.sin(t * 1.8) * 0.07;
            if (waveArm) waveArm.rotation.z = -2.25 + Math.sin(t * 3.4) * 0.38;
            palms.forEach(function (p, i) { p.rotation.z = Math.sin(t * 0.9 + i * 1.7) * 0.012; });
            // الصندوق: خمول خفيف — أو محاولة فتح كاملة إذا انضغط
            if (chestAttempt) {
              var el = t - chestAttempt.start;
              if (!chestAttempt.rattled && el > 0.02) { chestAttempt.rattled = true; SoundFX.rattle(); }
              if (el < 0.65) {
                // اهتزاز وخبطات القفل
                var shake = Math.sin(el * 55) * 0.045 * (1 - el / 0.65);
                treasureChest.rotation.z = shake;
                treasureChest.position.x = -8.5 + Math.sin(el * 47) * 0.14 * (1 - el / 0.65);
                treasureChest.position.y = TOP + Math.abs(Math.sin(el * 40)) * 0.12;
                if (chestLockBody) chestLockBody.position.x = Math.sin(el * 60) * 0.07;
                if (chestShackle) chestShackle.rotation.z = Math.sin(el * 52) * 0.22;
                if (chestLidGroup) chestLidGroup.rotation.x = 0;
              } else if (el < 1.25) {
                // الغطا بيحاول يرتفع… وبيقاوم
                var lp = (el - 0.65) / 0.6;
                var lift = Math.sin(lp * Math.PI * 0.85) * 0.34;
                if (chestLidGroup) chestLidGroup.rotation.x = -lift;
                treasureChest.rotation.z = Math.sin(el * 30) * 0.012;
                treasureChest.position.x = -8.5;
                treasureChest.position.y = TOP + lift * 0.2;
              } else if (el < 1.45) {
                // …وبيخبط راجع مسكّر
                if (!chestAttempt.slammed) {
                  chestAttempt.slammed = true;
                  SoundFX.slam();
                  if (chestLidGroup) chestLidGroup.rotation.x = 0;
                }
                treasureChest.position.y = TOP + Math.max(0, 0.1 - (el - 1.25) * 0.5);
              } else {
                treasureChest.rotation.z = 0;
                treasureChest.position.x = -8.5;
                treasureChest.position.y = TOP;
                if (chestLockBody) chestLockBody.position.x = 0;
                if (chestShackle) chestShackle.rotation.z = 0;
                if (!chestAttempt.spoke && el > 1.5) {
                  chestAttempt.spoke = true;
                  playSalli(); // «صلّوا على محمد ﷺ» بصوت مسجّل + النص بيطفو فوق الصندوق
                }
                if (el > 4.4) chestAttempt = null;
              }
              // نص الصلاة بيطفو وبيختفي ببطء
              if (salliSprite) {
                var so = el < 1.5 ? 0 : el < 1.9 ? (el - 1.5) / 0.4 : el > 3.9 ? Math.max(0, 1 - (el - 3.9) / 0.5) : 1;
                salliSprite.material.opacity = so;
                salliSprite.position.y = TOP + 15.2 + (el > 1.5 ? Math.min(1, (el - 1.5) / 3) * 0.9 : 0);
              }
              if (treasureGlow) treasureGlow.intensity = 1.1 + Math.sin(t * 6) * 0.4;
            } else {
              treasureChest.rotation.z = Math.sin(t * 1.7) * 0.03;
              treasureChest.position.y = TOP + Math.abs(Math.sin(t * 1.7)) * 0.08;
              treasureChest.position.x = -8.5;
              if (salliSprite) salliSprite.material.opacity = Math.max(0, salliSprite.material.opacity - dt * 2);
              if (treasureGlow) treasureGlow.intensity = 0.8 + Math.sin(t * 2.3) * 0.35;
            }
            if (chestRing) {
              var rs = 1 + Math.sin(t * 2.0) * 0.07;
              chestRing.scale.set(rs, rs, 1);
              chestRing.material.opacity = 0.4 + Math.sin(t * 2.0) * 0.18;
            }
            if (chestArrow) {
              chestArrow.position.y = TOP + 7.6 + Math.abs(Math.sin(t * 2.4)) * 0.85;
              chestArrow.rotation.y = Math.PI / 4 + Math.sin(t * 1.8) * 0.2;
            }
            chestSparkles.forEach(function (spr) {
              var tw = 0.5 + 0.5 * Math.sin(t * 3 + spr.userData.phase);
              spr.material.opacity = 0.25 + tw * 0.75;
              var ss = (0.9 + (spr.userData.phase % 0.9)) * (0.7 + tw * 0.55);
              spr.scale.set(ss, ss, 1);
            });
            gulls.forEach(function (bird) {
              var u = bird.userData;
              var ga = u.phase + t * u.speed;
              bird.position.set(Math.cos(ga) * u.radius, u.height + Math.sin(t * 0.9 + u.phase) * 1.6, Math.sin(ga) * u.radius);
              bird.rotation.y = -ga - (u.speed > 0 ? 0 : Math.PI);
              var flapA = Math.sin(t * u.flap + u.phase) * 0.65;
              if (u.wl) u.wl.rotation.z = flapA;
              if (u.wr) u.wr.rotation.z = -flapA;
            });
            boat.position.y = 0.1 + Math.sin(t * 1.25) * 0.22;
            boat.rotation.z = Math.sin(t * 1.1) * 0.045;
            boat.rotation.x = Math.sin(t * 0.9 + 1) * 0.03;
            marker.position.y = MARKER_Y + Math.sin(t * 2.2) * 0.14;
            var mpulse = 1 + Math.sin(t * 3.2) * 0.055;
            marker.scale.set(mpulse, 1, mpulse);
            if (marker.userData.inner) marker.userData.inner.material.opacity = 0.3 + (Math.sin(t * 3.2) * 0.5 + 0.5) * 0.32;
            clouds.forEach(function (cl) {
              cl.g.position.x += dt * cl.sp;
              if (cl.g.position.x > 420) cl.g.position.x = -420;
            });
          }
          // مع تقليل الحركة: محاولة الفتح بتصير بلا اهتزاز — بس خبطة القفل والصوت والنص الطافي
          if (reduced && chestAttempt) {
            var rel = t - chestAttempt.start;
            if (!chestAttempt.rattled) { chestAttempt.rattled = true; SoundFX.rattle(); }
            if (!chestAttempt.slammed && rel > 0.7) { chestAttempt.slammed = true; SoundFX.slam(); }
            if (!chestAttempt.spoke && rel > 1.0) { chestAttempt.spoke = true; playSalli(); }
            if (salliSprite) salliSprite.material.opacity = rel < 1.0 ? 0 : rel > 3.9 ? Math.max(0, 1 - (rel - 3.9) / 0.5) : 1;
            if (rel > 4.4) chestAttempt = null;
          }
          renderer.render(scene, camera);

          frames++;
          if (frames === 3) {
            loadProgress(1);
            setTimeout(function () { loader.classList.add("done"); }, 250);
            setTimeout(function () {
              showToast("أهلاً فيك باللعبة! اسحب ودوّر حول الجزيرة — وكل اشتراك جديد على يوتيوب بيحطّ بلاطة بالبحر", 5200);
            }, 1000);
          }
        }
        animate();
      }

      try {
        initWorld();
      } catch (err) {
        loader.classList.add("done");
        document.getElementById("glFallback").style.display = "flex";
      }

      // تلميح التحكم بيختفي بعد شوي
      setTimeout(function () { document.getElementById("hint").classList.add("faded"); }, 9000);

      // زر الاشتراك: بعد الضغط، تذكير إنو البلاطة بتنحسب
      var subBtn = document.getElementById("subBtn");
      if (subBtn) subBtn.addEventListener("click", function () {
        showToast("إذا اشتركت بالقناة، بلاطتك بتنحطّ بالبحر مع الدفعة الجاية — ارجع وشوف العدّاد", 5000);
      });

      // ======= التحديث الحي من count.json: العدد بيزيد لحاله بدون إعادة بناء الصفحة =======
      // العدد الفعّال = الأكبر بين المجلب والمضمّن — المعروض ما بينزل أبداً، بلاطة محطوطة ما بتنشال
      function applyLiveCount(n) {
        if (n <= COUNT) return;
        COUNT = n;
        document.getElementById("countNow").textContent = fmt.format(COUNT);
        document.getElementById("miniFill").style.width = (COUNT / TOTAL) * 100 + "%";
        if (window.__bltApplyTiles) window.__bltApplyTiles();
      }
      function pollCount() {
        if (!window.fetch) return;
        fetch("count.json?t=" + Date.now(), { cache: "no-store" })
          .then(function (r) { if (!r.ok) throw new Error("count.json unavailable"); return r.json(); })
          .then(function (data) {
            if (!data) return;
            var c = data.count;
            // بس عدد صحيح بين 0 و 10,000 بينقبل — غير هيك بينتجاهل بصمت
            if (typeof c === "number" && isFinite(c) && Math.floor(c) === c && c >= 0 && c <= TOTAL) {
              applyLiveCount(Math.max(c, COUNT));
            }
          })
          .catch(function () { /* فشل الجلب أو الملف مو موجود: منضل عالعدد المضمّن، بدون أي رسالة */ });
      }
      pollCount();
      setInterval(pollCount, 60000);
    </script>
  </body>
</html>
