<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>بلّط البحر — اللعبة</title>
    <script data-goatcounter="https://ballat-albahr.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #0c2b33;
        --ink-soft: #3d5a63;
        --line: rgba(160, 200, 210, 0.55);
        --hud-bg: rgba(255, 255, 255, 0.88);
        --yt: #ff0033;
        --gold: #d97706;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #eaf6f8;
          --ink-soft: #a8c8cf;
          --line: rgba(90, 140, 155, 0.5);
          --hud-bg: rgba(8, 32, 42, 0.88);
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        font-family: "Rubik", system-ui, sans-serif;
        background: #0b5e74;
        color: var(--ink);
        -webkit-user-select: none;
        user-select: none;
      }

      /* ---------- مسرح اللعبة: ملء الشاشة من أول لحظة ---------- */
      .stage {
        position: fixed;
        inset: 0;
        height: 100dvh;
        overflow: hidden;
        background: linear-gradient(180deg, #79c7e3 0%, #3d9dbd 55%, #12809e 100%);
        outline: none;
        -webkit-touch-callout: none;
      }
      .stage:focus-visible { outline: 3px solid #fff; outline-offset: -3px; }
      #gl { position: absolute; inset: 0; z-index: 1; }
      #gl canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      .gl-fallback {
        position: absolute; inset: 0; z-index: 1;
        display: none;
        align-items: center; justify-content: center;
        text-align: center; padding: 24px;
        background: linear-gradient(180deg, #79c7e3, #12809e);
        color: #fff; font-weight: 800; font-size: 1.05rem;
      }

      /* ---------- شاشة التحميل (إحساس لعبة) ---------- */
      .loader {
        position: absolute; inset: 0; z-index: 60;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        background: linear-gradient(180deg, #8fd0ea 0%, #4aa8c6 45%, #0e6e8c 100%);
        transition: opacity 0.7s ease;
        text-align: center; padding: 24px;
      }
      .loader.done { opacity: 0; pointer-events: none; }
      .loader .l-title {
        font-size: clamp(2.4rem, 9vw, 3.6rem);
        font-weight: 900; color: #fff; line-height: 1.15;
        text-shadow: 0 3px 0 rgba(8, 70, 90, 0.35), 0 10px 26px rgba(8, 70, 90, 0.35);
      }
      .loader .l-sub { color: rgba(255,255,255,0.92); font-weight: 700; font-size: 1rem; }
      .loader .l-bar {
        width: min(260px, 70vw); height: 12px;
        border-radius: 999px;
        background: rgba(255,255,255,0.3);
        border: 2px solid rgba(255,255,255,0.65);
        overflow: hidden;
      }
      .loader .l-bar > i {
        display: block; height: 100%; width: 0%;
        background: #ffb340;
        border-radius: 999px;
        transition: width 0.35s ease;
      }
      .loader .l-waves { font-size: 1.5rem; letter-spacing: 6px; opacity: 0.85; animation: bob 1.6s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

      /* ---------- HUD العلوي: عدّاد صغير بس ---------- */
      .hud-top {
        position: absolute;
        top: calc(env(safe-area-inset-top, 0px) + 10px);
        inset-inline-start: 10px;
        inset-inline-end: 10px;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
        pointer-events: none;
      }
      .chip {
        pointer-events: auto;
        display: inline-flex; align-items: center; gap: 8px;
        background: var(--hud-bg);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 14px 6px 10px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        font-family: inherit;
        color: var(--ink);
        box-shadow: 0 6px 18px rgba(6, 45, 60, 0.25);
      }
      button.chip { cursor: pointer; }
      button.chip:active { transform: scale(0.96); }
      .chip .play {
        width: 26px; height: 26px; border-radius: 50%;
        background: var(--yt); color: #fff;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 0.72rem; flex: none;
        box-shadow: 0 3px 8px rgba(200, 0, 40, 0.4);
      }
      .chip .c-num { font-weight: 900; font-size: 1.02rem; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .chip .c-lab { font-size: 0.68rem; font-weight: 700; color: var(--ink-soft); line-height: 1.1; white-space: nowrap; }
      .chip .c-txt { display: flex; flex-direction: column; }
      .chip .mini-bar { width: 74px; height: 5px; border-radius: 999px; background: rgba(120,160,170,0.35); overflow: hidden; margin-top: 3px; }
      .chip .mini-bar > i { display: block; height: 100%; width: 0%; background: var(--yt); transition: width 1.2s ease; }
      .chip.chest { border-color: rgba(217, 119, 6, 0.55); font-weight: 800; font-size: 0.86rem; padding: 8px 14px; }
      .chip.chest .lock { font-size: 1rem; }

      /* ---------- لوحة البلدان: تحت شريحة العدّاد بجهة البداية، بنفس زجاج الـ chips ---------- */
      .countries-panel {
        position: absolute;
        top: calc(env(safe-area-inset-top, 0px) + 84px);
        inset-inline-start: 10px;
        z-index: 10;
        display: flex; flex-direction: column; gap: 5px;
        background: var(--hud-bg);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 8px 12px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-shadow: 0 6px 18px rgba(6, 45, 60, 0.25);
        max-width: min(64vw, 264px);
        pointer-events: none;
      }
      .cp-row { display: flex; align-items: center; gap: 7px; font-size: 0.82rem; font-weight: 800; white-space: nowrap; }
      .cp-flag { width: 26px; height: 18px; border-radius: 3px; border: 1px solid rgba(0, 0, 0, 0.18); flex: none; }
      .cp-count { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-weight: 900; }
      .cp-tag { background: var(--yt); color: #fff; font-size: 0.6rem; font-weight: 800; padding: 2px 7px; border-radius: 999px; flex: none; }
      @media (max-width: 700px) {
        .countries-panel { top: calc(env(safe-area-inset-top, 0px) + 78px); padding: 6px 9px; gap: 4px; border-radius: 13px; }
        .cp-row { font-size: 0.74rem; gap: 5px; }
        .cp-flag { width: 22px; height: 15px; }
        .cp-tag { font-size: 0.54rem; padding: 1px 5px; }
      }

      /* ---------- أزرار اللعب السفلية ---------- */
      .sub-btn {
        position: absolute;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
        inset-inline-start: 14px;
        z-index: 10;
        display: inline-flex; align-items: center; gap: 9px;
        background: var(--yt); color: #fff;
        font-weight: 900; font-size: 1rem;
        padding: 13px 22px; border-radius: 999px;
        text-decoration: none;
        box-shadow: 0 10px 24px rgba(160, 0, 30, 0.45);
        border: 2px solid rgba(255,255,255,0.5);
      }
      .sub-btn:active { transform: scale(0.96); }
      @keyframes subPulse {
        0% { box-shadow: 0 10px 24px rgba(160, 0, 30, 0.45), 0 0 0 0 rgba(255, 0, 51, 0.55); }
        70% { box-shadow: 0 10px 24px rgba(160, 0, 30, 0.45), 0 0 0 16px rgba(255, 0, 51, 0); }
        100% { box-shadow: 0 10px 24px rgba(160, 0, 30, 0.45), 0 0 0 0 rgba(255, 0, 51, 0); }
      }
      .sub-btn { animation: subPulse 2.2s ease-out infinite; font-size: 1.08rem; padding: 15px 26px; z-index: 12; }
      @media (prefers-reduced-motion: reduce) { .sub-btn { animation: none; } }
      .stage.expanded-fixed { position: fixed; inset: 0; height: 100dvh; z-index: 999; }
      body.locked { overflow: hidden; }
      .sub-btn .play {
        width: 24px; height: 24px; border-radius: 50%;
        background: #fff; color: var(--yt);
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 0.66rem;
      }
      /* شريط التحكم: لاصق بحافة الشاشة اليسرى (فيزيائياً) بنص الارتفاع — بعيد عن الجزيرة وعن باقي العناصر */
      .cambtns {
        position: absolute;
        left: 10px;
        right: auto;
        top: 50%;
        transform: translateY(-50%);
        z-index: 10;
        display: flex; flex-direction: column; gap: 8px;
        align-items: center;
      }
      .cambtns button {
        width: 48px; height: 48px; border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--hud-bg);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: var(--ink);
        font-family: inherit;
        font-size: 1.4rem; font-weight: 800; line-height: 1;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 6px 16px rgba(6, 45, 60, 0.28);
      }
      .cambtns button:active { transform: scale(0.92); }
      .cambtns button.small { font-size: 1.02rem; }
      .cambtns button.sound { font-size: 1.15rem; position: relative; }
      .cambtns button.sound.muted { opacity: 0.62; }
      .cambtns button.sound.muted::after {
        content: ""; position: absolute; left: 9px; right: 9px; top: 50%;
        height: 3px; border-radius: 2px; background: #e23b3b;
        transform: rotate(-38deg);
      }
      /* زر الجودة: برّا شريط التحكم، لحاله أسفل اليسار — مشان عرضه ما يوسّع الشريط ويبعّد الدوائر عن الحافة */
      .quality-btn {
        position: absolute;
        left: 12px;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
        z-index: 10;
        border: 1px solid var(--line);
        background: var(--hud-bg);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: var(--ink);
        font-family: inherit;
        border-radius: 999px;
        font-size: 0.72rem; font-weight: 800;
        padding: 9px 13px;
        white-space: nowrap;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(6, 45, 60, 0.28);
      }
      .quality-btn:active { transform: scale(0.94); }
      @media (max-width: 700px) {
        .cambtns { left: 8px; gap: 7px; }
        .cambtns button { width: 44px; height: 44px; }
        .quality-btn { left: 10px; }
      }

      .hint {
        position: absolute;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
        left: 50%; transform: translateX(-50%);
        z-index: 9;
        background: rgba(6, 40, 52, 0.55);
        color: #eaf6f8;
        border-radius: 999px;
        padding: 7px 18px;
        font-size: 0.85rem; font-weight: 700;
        white-space: nowrap;
        pointer-events: none;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        transition: opacity 1s ease;
      }
      .hint.faded { opacity: 0; }
      @media (max-width: 760px) { .hint { display: none; } }

      .toast {
        position: absolute;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 78px);
        left: 50%; transform: translate(-50%, 12px);
        z-index: 11;
        max-width: min(92vw, 520px);
        background: var(--hud-bg);
        border: 1px solid var(--line);
        color: var(--ink);
        border-radius: 16px;
        padding: 10px 18px;
        font-weight: 700; font-size: 0.95rem;
        text-align: center;
        box-shadow: 0 10px 26px rgba(6, 45, 60, 0.3);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        opacity: 0; pointer-events: none;
        transition: opacity 0.35s ease, transform 0.35s ease;
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      /* ---------- عصا التجوّل ---------- */
      .stick {
        position: absolute;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
        inset-inline-start: 18px;
        z-index: 10;
        width: 118px; height: 118px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.22);
        border: 2px solid rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        display: none;
        touch-action: none;
      }
      .stage.explore .stick { display: block; }
      .stick .knob {
        position: absolute; left: 50%; top: 50%;
        width: 52px; height: 52px; border-radius: 50%;
        background: var(--hud-bg);
        border: 1px solid var(--line);
        box-shadow: 0 4px 12px rgba(6, 45, 60, 0.35);
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      .stick .knob::after {
        content: ""; position: absolute; inset: 15px;
        border-radius: 50%; background: #12809e; opacity: 0.55;
      }
      /* زر الاشتراك بيضل ظاهر دائماً — حتى بوضع التجوّل */
    </style>
  </head>
  <body>
    <div class="stage" id="stage" tabindex="0" aria-label="لعبة بلط البحر: جزيرة وسط بحر حقيقي، اسحب للتدوير حول الجزيرة وقرّب وبعّد للاستكشاف">
      <div id="gl" aria-hidden="true"></div>
      <div class="gl-fallback" id="glFallback">متصفحك ما بيدعم العرض ثلاثي الأبعاد هون — جرّب متصفح أحدث لتلعب.</div>

      <div class="loader" id="loader" aria-hidden="true">
        <div class="l-waves">〰️ 🌊 〰️</div>
        <div class="l-title">بلّط البحر</div>
        <div class="l-bar"><i id="loadFill"></i></div>
        <div class="l-sub">عم نجهّز البحر والجزيرة…</div>
      </div>

      <div class="hud-top">
        <button type="button" class="chip" id="counterChip" aria-label="عداد يوتيوب: اضغط لعرض البحر كله">
          <span class="play">▶</span>
          <span class="c-txt">
            <span class="c-num"><span id="countNow">13</span> / 10,000</span>
            <span class="c-lab">بلاطة بالبحر · يوتيوب</span>
            <span class="mini-bar"><i id="miniFill"></i></span>
          </span>
        </button>
        <div class="chip chest" aria-label="صندوق الكنز مقفول">
          <span class="lock">🔒</span><span>شو فيه الصندوق؟</span>
        </div>
      </div>

      <div class="countries-panel" id="countriesPanel" aria-label="بلدان المتابعين على البلاطات"></div>

      <a class="sub-btn" id="subBtn" href="https://www.youtube.com/@ballat.albahr?sub_confirmation=1" target="_blank" rel="noopener" aria-label="اشترك بقناة بلط البحر على يوتيوب">
        <span class="play">▶</span><span>اشترك بالقناة</span>
      </a>

      <div class="cambtns">
        <button type="button" id="soundToggle" class="sound" aria-label="تشغيل أو كتم أصوات البحر والنوارس" aria-pressed="true" title="الصوت">🔊</button>
        <button type="button" id="fsToggle" class="small" aria-label="ملء الشاشة والتجوّل بالجزيرة">⛶</button>
        <button type="button" id="zoomIn" aria-label="تقريب الكاميرا">+</button>
        <button type="button" id="zoomOut" aria-label="إبعاد الكاميرا">−</button>
        <button type="button" id="camReset" class="small" aria-label="إعادة ضبط الكاميرا">⌖</button>
      </div>

      <button type="button" id="qualityBtn" class="quality-btn" aria-label="تبديل جودة العرض بين تلقائي وخفيفة وعالية">الجودة: تلقائي</button>

      <div class="stick" id="stick" aria-hidden="true"><div class="knob" id="stickKnob"></div></div>
      <div class="hint" id="hint">اسحب لتدوّر حول الجزيرة · قرّب وبعّد بإصبعين · جرّب تفتح صندوق الكنز</div>
      <div class="toast" id="toast" role="status"></div>

                treasureChest.position.x = -8.5;
                treasureChest.position.y = TOP;
                if (chestLockBody) chestLockBody.position.x = 0;
                if (chestShackle) chestShackle.rotation.z = 0;
                if (el > 1.6) chestAttempt = null;
              }
              if (treasureGlow) treasureGlow.intensity = 1.1 + Math.sin(t * 6) * 0.4;
            } else {
              treasureChest.rotation.z = Math.sin(t * 1.7) * 0.03;
              treasureChest.position.y = TOP + Math.abs(Math.sin(t * 1.7)) * 0.08;
              treasureChest.position.x = -8.5;
              if (treasureGlow) treasureGlow.intensity = 0.8 + Math.sin(t * 2.3) * 0.35;
            }
            // نبضة الجامع: صوت «صلّوا على محمد ﷺ» مرة وحدة (بيحترم الكتم) + توهّج ذهبي بيطلع وبيهدا
            if (mosquePulse) {
              var mel = t - mosquePulse.start;
              if (!mosquePulse.spoke && mel > 0.02) { mosquePulse.spoke = true; playSalli(); }
              if (mel < 1.7) {
                setMosqueGlow(Math.sin(Math.min(mel / 1.7, 1) * Math.PI));
              } else {
                setMosqueGlow(0);
                mosquePulse = null;
              }
            }
            // إعطاء التمرة: صوت «استغفر الله، صحتين وهنا ع تمره» مرة وحدة (بيحترم الكتم) +
            // تمرة بتطير من الصحن باتجاه الكاميرا مع حركة إعطاء صغيرة + نص «استغفر الله» طايف فوق الشخصية
            if (heroGive) {
              var hel = t - heroGive.start;
              if (!heroGive.spoke && hel > 0.02) { heroGive.spoke = true; playTamr(); }
              if (flyDate && heroGive.from && heroGive.to) {
                if (hel < 0.95) {
                  var fp = hel / 0.95;
                  var fe = fp * fp * (3 - 2 * fp);
                  flyDate.visible = true;
                  flyDate.position.lerpVectors(heroGive.from, heroGive.to, fe);
                  flyDate.position.y += Math.sin(fp * Math.PI) * 2.2;
                  flyDate.rotation.x += dt * 7;
                  flyDate.rotation.y += dt * 5;
                  var fs = 1 + fp * 1.7; // بتكبر وهي عم تقرّب من الزائر
                  flyDate.scale.set(0.85 * fs, 0.62 * fs, 1.35 * fs);
                } else {
                  flyDate.visible = false;
                }
              }
              // حركة الإعطاء الصغيرة: ميلة خفيفة لقدّام وبترجع
              hero.rotation.x = hel < 1.1 ? Math.sin(Math.min(hel / 1.1, 1) * Math.PI) * 0.1 : 0;
              if (heroLabel && heroLabelMat) {
                heroLabel.visible = true;
                var hFade = hel < 0.25 ? hel / 0.25 : (hel > 2.1 ? Math.max(0, (2.7 - hel) / 0.6) : 1);
                heroLabelMat.opacity = hFade;
                heroLabel.position.y = TOP + HERO_LABEL_Y + Math.min(hel, 1.4) * 0.55; // بيطفو لفوق شوي شوي
              }
              if (hel > 2.7) {
                heroGive = null;
                hero.rotation.x = 0;
                if (flyDate) flyDate.visible = false;
                if (heroLabel) { heroLabel.visible = false; heroLabel.position.y = TOP + HERO_LABEL_Y; }
                if (heroLabelMat) heroLabelMat.opacity = 0;
              }
            }
            if (chestRing) {
              var rs = 1 + Math.sin(t * 2.0) * 0.07;
              chestRing.scale.set(rs, rs, 1);
              chestRing.material.opacity = 0.4 + Math.sin(t * 2.0) * 0.18;
            }
            if (chestArrow) {
              chestArrow.position.y = TOP + 7.6 + Math.abs(Math.sin(t * 2.4)) * 0.85;
              chestArrow.rotation.y = Math.PI / 4 + Math.sin(t * 1.8) * 0.2;
            }
            chestSparkles.forEach(function (spr) {
              var tw = 0.5 + 0.5 * Math.sin(t * 3 + spr.userData.phase);
              spr.material.opacity = 0.25 + tw * 0.75;
              var ss = (0.9 + (spr.userData.phase % 0.9)) * (0.7 + tw * 0.55);
              spr.scale.set(ss, ss, 1);
            });
            gulls.forEach(function (bird) {
              var u = bird.userData;
              var ga = u.phase + t * u.speed;
              bird.position.set(Math.cos(ga) * u.radius, u.height + Math.sin(t * 0.9 + u.phase) * 1.6, Math.sin(ga) * u.radius);
              bird.rotation.y = -ga - (u.speed > 0 ? 0 : Math.PI);
              var flapA = Math.sin(t * u.flap + u.phase) * 0.65;
              if (u.wl) u.wl.rotation.z = flapA;
              if (u.wr) u.wr.rotation.z = -flapA;
            });
            boat.position.y = 0.1 + Math.sin(t * 1.25) * 0.22;
            boat.rotation.z = Math.sin(t * 1.1) * 0.045;
            boat.rotation.x = Math.sin(t * 0.9 + 1) * 0.03;
            marker.position.y = MARKER_Y + Math.sin(t * 2.2) * 0.14;
            var mpulse = 1 + Math.sin(t * 3.2) * 0.055;
            marker.scale.set(mpulse, 1, mpulse);
            if (marker.userData.inner) marker.userData.inner.material.opacity = 0.3 + (Math.sin(t * 3.2) * 0.5 + 0.5) * 0.32;
            var ytPulse = Math.sin(t * 2.6) * 0.5 + 0.5;
            flagGlows.forEach(function (g) { g.material.opacity = 0.72 + ytPulse * 0.28; });
            flagHalos.forEach(function (h) {
              h.material.opacity = 0.3 + ytPulse * 0.24;
              var hs = TILE * (2.0 + ytPulse * 0.35);
              h.scale.set(hs, hs, 1);
            });
            flagFrames.forEach(function (m) { m.emissiveIntensity = 0.45 + ytPulse * 0.65; });
            flagBadges.forEach(function (b) {
              var bs = 2.5 + ytPulse * 0.22;
              b.scale.set(bs, bs, 1);
            });
            clouds.forEach(function (cl) {
              cl.g.position.x += dt * cl.sp;
              if (cl.g.position.x > 420) cl.g.position.x = -420;
            });
          }
          // مع تقليل الحركة: محاولة فتح الصندوق بتنتهي بصمت وهو مقفول — بلا اهتزاز وبلا أي صوت
          if (reduced && chestAttempt) {
            if (t - chestAttempt.start > 1.6) chestAttempt = null;
          }
          // ومع تقليل الحركة كمان: ضغطة الشخصية بتشغّل صوت التمر نفسه (وبيحترم الكتم) وبتعرض النص
          // الطايف ثابتاً — بس بلا تمرة طايرة وبلا حركة إعطاء
          if (reduced && heroGive) {
            var rhel = t - heroGive.start;
            if (!heroGive.spoke) { heroGive.spoke = true; playTamr(); }
            if (flyDate) flyDate.visible = false;
            if (heroLabel && heroLabelMat) {
              heroLabel.visible = true;
              heroLabelMat.opacity = 0.97;
              heroLabel.position.y = TOP + HERO_LABEL_Y;
            }
            if (rhel > 2.7) {
              heroGive = null;
              if (heroLabel) heroLabel.visible = false;
              if (heroLabelMat) heroLabelMat.opacity = 0;
            }
          }
          // ومع تقليل الحركة كمان: ضغطة الجامع بتشغّل الصوت نفسه (وبيحترم الكتم) — بس التوهّج ثابت بلا نبض متحرك
          if (reduced && mosquePulse) {
            var mrel = t - mosquePulse.start;
            if (!mosquePulse.spoke) { mosquePulse.spoke = true; playSalli(); }
            setMosqueGlow(0.45);
            if (mrel > 2.2) { setMosqueGlow(0); mosquePulse = null; }
          }
          updateWhale(t, dt);
          // بالوضع الخفيف: الرسم كل إطار ثانٍ بس (~30fps) — الحركة مبنية على الزمن فبتبقى صحيحة
          renderTick++;
          if (!LITE || renderTick % 2 === 1) renderer.render(scene, camera);

          frames++;
          if (frames === 3) {
            loadProgress(1);
            setTimeout(function () { loader.classList.add("done"); }, 250);
            setTimeout(function () {
              showToast("أهلاً فيك باللعبة! اسحب ودوّر حول الجزيرة — وكل اشتراك جديد على يوتيوب بيحطّ بلاطة بالبحر", 5200);
            }, 1000);
          }
        }
        animate();
        // رجوع التبويب للواجهة: إعادة تشغيل حلقة الرسم مرة وحدة (بلا حلقتين مزدوجتين)
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden && !rafRunning) {
            clock.getDelta(); // تصفير الفجوة الزمنية عشان ما تقفز الحركة
            animate();
          }
        });
      }

      try {
        initWorld();
      } catch (err) {
        loader.classList.add("done");
        document.getElementById("glFallback").style.display = "flex";
      }

      // تلميح التحكم بيختفي بعد شوي
      setTimeout(function () { document.getElementById("hint").classList.add("faded"); }, 9000);

      // زر الاشتراك: بعد الضغط، تذكير إنو البلاطة بتنحسب
      var subBtn = document.getElementById("subBtn");
      if (subBtn) subBtn.addEventListener("click", function () {
        showToast("إذا اشتركت بالقناة، بلاطتك بتنحطّ بالبحر مع الدفعة الجاية — ارجع وشوف العدّاد", 5000);
      });

      // زر الجودة: بيدوّر تلقائي ← خفيفة ← عالية، بيحفظ الاختيار وبيععيد تحميل الصفحة
      // (الهندسة والظلال و antialias بتنقرر وقت إنشاء الـ renderer)
      var qualityBtn = document.getElementById("qualityBtn");
      if (qualityBtn) {
        qualityBtn.textContent = QUALITY === "lite" ? "الجودة: خفيفة" : QUALITY === "high" ? "الجودة: عالية" : "الجودة: تلقائي (" + (LITE ? "خفيفة" : "عالية") + ")";
        qualityBtn.addEventListener("click", function () {
          var nextQ = QUALITY === "auto" ? "lite" : QUALITY === "lite" ? "high" : "auto";
          try { window.localStorage.setItem("blt-quality", nextQ); } catch (e) {}
          window.location.reload();
        });
      }

      // ======= التحديث الحي من count.json: العدد بيزيد لحاله بدون إعادة بناء الصفحة =======
      // العدد الفعّال = الأكبر بين المجلب والمضمّن — المعروض ما بينزل أبداً، بلاطة محطوطة ما بتنشال
      function applyLiveCount(n) {
        if (n <= COUNT) return;
        COUNT = n;
        document.getElementById("countNow").textContent = fmt.format(COUNT);
        document.getElementById("miniFill").style.width = (COUNT / TOTAL) * 100 + "%";
        if (window.__bltApplyTiles) window.__bltApplyTiles();
      }
      function pollCount() {
        if (!window.fetch) return;
        fetch("count.json?t=" + Date.now(), { cache: "no-store" })
          .then(function (r) { if (!r.ok) throw new Error("count.json unavailable"); return r.json(); })
          .then(function (data) {
            if (!data) return;
            var c = data.count;
            // بس عدد صحيح بين 0 و 10,000 بينقبل — غير هيك بينتجاهل بصمت
            if (typeof c === "number" && isFinite(c) && Math.floor(c) === c && c >= 0 && c <= TOTAL) {
              applyLiveCount(Math.max(c, COUNT));
            }
          })
          .catch(function () { /* فشل الجلب أو الملف مو موجود: منضل عالعدد المضمّن، بدون أي رسالة */ });
      }
      pollCount();
      setInterval(pollCount, 60000);

      // ======= لوحة البلدان + التحديث الحي من countries.json — نفس نمط count.json بالضبط =======
      // مسار نسبي + ?t= لكسر الكاش + cache:'no-store' + إعادة جلب كل 60 ثانية + فشل صامت.
      // الدمج إضافي فقط: علم انحطّ مرة ما بينشال ولا بيتبدّل أبداً.
      function renderCountriesPanel() {
        var panel = document.getElementById("countriesPanel");
        if (!panel) return;
        var agg = {};
        Object.keys(COUNTRIES).forEach(function (k) {
          var e = COUNTRIES[k];
          if (!e || !e.code) return;
          if (!agg[e.code]) agg[e.code] = { count: 0, yt: false };
          agg[e.code].count++;
          if (e.source === "youtube") agg[e.code].yt = true;
        });
        panel.innerHTML = "";
        var codes = Object.keys(agg);
        var firstSeen = codes.slice();
        codes.sort(function (a, b) {
          if (agg[b].count !== agg[a].count) return agg[b].count - agg[a].count;
          return firstSeen.indexOf(a) - firstSeen.indexOf(b);
        });
        codes.forEach(function (code) {
          var row = document.createElement("div");
          row.className = "cp-row";
          var cv = document.createElement("canvas");
          cv.width = 52; cv.height = 36; cv.className = "cp-flag";
          cv.setAttribute("aria-hidden", "true");
          drawFlagTo(cv.getContext("2d"), 52, 36, code);
          row.appendChild(cv);
          var nm = document.createElement("span");
          nm.className = "cp-name"; nm.textContent = countryName(code);
          row.appendChild(nm);
          var ct = document.createElement("span");
          ct.className = "cp-count"; ct.textContent = fmt.format(agg[code].count);
          row.appendChild(ct);
          if (agg[code].yt) {
            var tag = document.createElement("span");
            tag.className = "cp-tag"; tag.textContent = "▶ يوتيوب";
            row.appendChild(tag);
          }
          panel.appendChild(row);
        });
        panel.style.display = panel.children.length ? "" : "none";
      }
      renderCountriesPanel();
      function pollCountries() {
        if (!window.fetch) return;
        fetch("countries.json?t=" + Date.now(), { cache: "no-store" })
          .then(function (r) { if (!r.ok) throw new Error("countries.json unavailable"); return r.json(); })
          .then(function (data) {
            if (!data || typeof data !== "object") return;
            var changed = false;
            Object.keys(data).forEach(function (k) {
              var n = parseInt(k, 10);
              var e = data[k];
              if (!isFinite(n) || n < 1 || n > TOTAL) return;
              if (!e || typeof e.code !== "string" || !e.code) return;
              if (COUNTRIES[k]) return; // محطوطة من قبل — بتضلّ متل ما هي
              var src = ["youtube", "instagram", "facebook", "tiktok"].indexOf(e.source) >= 0 ? e.source : "youtube";
              COUNTRIES[k] = { code: e.code.toUpperCase(), source: src };
              changed = true;
            });
            if (changed) {
              if (window.__bltApplyCountries) window.__bltApplyCountries();
              renderCountriesPanel();
            }
          })
          .catch(function () { /* فشل الجلب أو الملف مو موجود: الأعلام المضمّنة بتضلّ ظاهرة، بدون أي رسالة */ });
      }
      pollCountries();
      setInterval(pollCountries, 60000);
    </script>
  </body>
